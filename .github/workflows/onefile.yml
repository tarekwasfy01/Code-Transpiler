name: build-onefile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows-onefile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build standalone executable
        shell: msys2 {0}
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          export CC="$(cygpath -w "$(command -v gcc)")"
          cmd.exe /c "powershell.exe -NoProfile -ExecutionPolicy Bypass -File build-onefile.ps1"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CodeTranspiler-windows-x64
          path: dist\CodeTranspiler.exe
          if-no-files-found: error
