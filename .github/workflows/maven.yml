name: Maven CI
on:
  push:
    branches: [ java ]
  pull_request:
    branches: [ java ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test Java
        working-directory: java
        run: mvn -B -ntp verify
