name: Maven CI
on:
  push:
    branches: [ java ]
  pull_request:
    branches: [ java ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test Java
        working-directory: java
        run: mvn -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native JavaScript parity
        run: |
          node javascript/test/smoke.mjs
          node javascript/test/core-parity.mjs
