name: Publish Maven package

on:
  push:
    branches: [ java ]
    paths:
      - '.github/publish-1.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Maven package version'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify Maven package 1.0.0
        working-directory: java
        run: mvn -B -ntp -Drevision=1.0.0 verify
      - name: Publish 1.0.0 to GitHub Packages
        working-directory: java
        run: mvn -B -ntp -Drevision=1.0.0 deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
