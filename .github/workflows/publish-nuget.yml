name: Pack and publish NuGet

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to nuget.org after packing
        required: true
        default: false
        type: boolean
  push:
    branches:
      - NuGet
    tags:
      - 'v*'

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack src/CodeTranspiler.Managed/CodeTranspiler.Managed.csproj -c Release -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: NuGet login (OIDC trusted publishing)
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'push' && github.ref == 'refs/heads/NuGet' && contains(github.event.head_commit.message, '[publish]')) || inputs.publish }}
        uses: NuGet/login@v1
        id: login
        with:
          user: tarekwasfy01

      - name: Publish to nuget.org
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'push' && github.ref == 'refs/heads/NuGet' && contains(github.event.head_commit.message, '[publish]')) || inputs.publish }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
