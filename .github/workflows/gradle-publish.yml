name: Gradle Package

on:
  push:
    branches: [ Java-Gradle ]
    paths:
      - '.github/publish-gradle-1.0.0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Gradle package version'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        with:
          gradle-version: '8.10.2'

      - name: Build with Gradle
        working-directory: java
        run: gradle --no-daemon -PreleaseVersion=1.0.0 clean build fatJar

      - name: Publish to GitHub Packages
        working-directory: java
        run: gradle --no-daemon -PreleaseVersion=1.0.0 publish
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
