name: test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Compile every public package and command
        run: go build ./...
      - name: Run deterministic package smoke tests
        run: go test ./internal/matrixir ./cmd/tree-sitter-frontend-closure -count=1 -timeout 3m
