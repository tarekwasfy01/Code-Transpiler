plugins {
    id 'application'
    id 'maven-publish'
}
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
    withJavadocJar()
}
application { mainClass = 'io.github.tarekwasfy01.transpiler.cli.Main' }
dependencies { implementation project(':code-transpiler-gradle-core') }
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}
publishing {
    publications {
        github(MavenPublication) {
            from components.java
            artifact(tasks.named('fatJar'))
            artifactId = 'code-transpiler-gradle-cli'
            pom {
                name = 'Code Transpiler Gradle CLI'
                description = 'Native Java CLI of Code Transpiler, built and published with Gradle.'
                url = 'https://github.com/tarekwasfy01/Code-Transpiler'
                licenses { license { name = 'MIT License'; url = 'https://opensource.org/licenses/MIT'; distribution = 'repo' } }
                developers { developer { name = 'Tarek Wasfy'; url = 'https://github.com/tarekwasfy01' } }
                scm {
                    connection = 'scm:git:https://github.com/tarekwasfy01/Code-Transpiler.git'
                    developerConnection = 'scm:git:https://github.com/tarekwasfy01/Code-Transpiler.git'
                    url = 'https://github.com/tarekwasfy01/Code-Transpiler'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/tarekwasfy01/Code-Transpiler')
            credentials { username = System.getenv('USERNAME'); password = System.getenv('TOKEN') }
        }
    }
}
